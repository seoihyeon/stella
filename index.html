<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>유튜브 댓글창 메이커</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wght@600;700&family=Noto+Sans+KR:wght@400;500;700&family=Roboto:wght@400;500;700&display=swap">
<script src="https://cdnjs.cloudflare.com/ajax/libs/html2canvas/1.4.1/html2canvas.min.js"></script>
<style>
/* ============ 앱 셸 토큰 ============ */
:root{
  --app-bg:#efece8; --stage:#e5e1dc; --panel:#fbfaf9; --panel-2:#f2efec;
  --line:#ddd7d1; --line-soft:#e8e3de;
  --ink:#1b1917; --ink-2:#6d655e; --ink-3:#9a938b;
  --accent:#c8322f; --accent-ink:#ffffff; --accent-soft:#f7e4e3; --focus:#c8322f;
  --shadow:0 1px 2px rgba(40,30,25,.08), 0 8px 24px rgba(40,30,25,.06);
}
@media (prefers-color-scheme: dark){
  :root:not([data-theme="light"]){
    --app-bg:#141312; --stage:#0e0d0d; --panel:#1d1b1a; --panel-2:#232120;
    --line:#332f2d; --line-soft:#282524;
    --ink:#f2eeea; --ink-2:#a49b93; --ink-3:#7b736c;
    --accent:#f0605c; --accent-ink:#241110; --accent-soft:#33201f; --focus:#f0605c;
    --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  --app-bg:#141312; --stage:#0e0d0d; --panel:#1d1b1a; --panel-2:#232120;
  --line:#332f2d; --line-soft:#282524;
  --ink:#f2eeea; --ink-2:#a49b93; --ink-3:#7b736c;
  --accent:#f0605c; --accent-ink:#241110; --accent-soft:#33201f; --focus:#f0605c;
  --shadow:0 1px 2px rgba(0,0,0,.4), 0 10px 30px rgba(0,0,0,.35);
}

*{box-sizing:border-box}
body{
  margin:0; background:var(--app-bg); color:var(--ink);
  font-family:"Noto Sans KR","Roboto",-apple-system,BlinkMacSystemFont,"Apple SD Gothic Neo",sans-serif;
  font-size:13px; -webkit-font-smoothing:antialiased;
}
button{font-family:inherit}
:focus-visible{outline:2px solid var(--focus); outline-offset:2px; border-radius:4px}

.app{display:grid; grid-template-columns:352px 1fr; height:100vh; min-height:600px}
.rail{background:var(--panel); border-right:1px solid var(--line); display:flex; flex-direction:column; min-height:0}
.rail-head{padding:16px 18px 14px; border-bottom:1px solid var(--line-soft); display:flex; align-items:baseline; gap:9px; flex-wrap:wrap}
.brand{font-family:"Archivo","Noto Sans KR",sans-serif; font-weight:700; font-size:19px; letter-spacing:-.02em; margin:0}
.brand em{font-style:normal; color:var(--accent)}
.brand-sub{font-size:11px; color:var(--ink-3)}
.rail-body{overflow-y:auto; flex:1; padding-bottom:70px}
.rail-foot{border-top:1px solid var(--line); padding:12px 14px; display:flex; gap:8px; background:var(--panel)}

.stage{
  background:var(--stage); position:relative; overflow:auto;
  background-image:radial-gradient(rgba(128,120,112,.28) 1px, transparent 1px);
  background-size:22px 22px;
  display:flex; align-items:flex-start; justify-content:center; padding:44px 32px 96px;
}
/* 축소한 만큼만 자리를 차지하도록 실제 크기 박스를 따로 둔다 */
.stage-box{position:relative; flex:none}
.stage-inner{transform-origin:top left; position:absolute; left:0; top:0; color:var(--ink)}
.zoombar{
  position:fixed; right:22px; bottom:20px; z-index:20; display:flex; align-items:center; gap:10px;
  background:var(--panel); border:1px solid var(--line); border-radius:999px; padding:7px 14px;
  box-shadow:var(--shadow); font-size:12px;
}
.zoombar input[type=range]{width:100px; accent-color:var(--accent)}
.zoomval{font-variant-numeric:tabular-nums; color:var(--ink-2); min-width:38px; text-align:right}

details.sec{border-bottom:1px solid var(--line-soft)}
details.sec > summary{list-style:none; cursor:pointer; padding:13px 18px; display:flex; align-items:center; gap:9px; font-weight:700; font-size:12.5px; user-select:none}
details.sec > summary::-webkit-details-marker{display:none}
details.sec > summary:hover{background:var(--panel-2)}
.sec-num{font-family:"Archivo",sans-serif; font-size:10px; color:var(--ink-3); border:1px solid var(--line); border-radius:5px; padding:1px 5px; font-variant-numeric:tabular-nums}
.sec-chev{margin-left:auto; color:var(--ink-3); transition:transform .18s ease}
details[open] > summary .sec-chev{transform:rotate(90deg)}
.sec-body{padding:2px 18px 18px; display:flex; flex-direction:column; gap:13px}

.field{display:flex; flex-direction:column; gap:6px}
.field > label, .flabel{font-size:11px; color:var(--ink-2); font-weight:500}
input[type=text], textarea, select{
  width:100%; background:var(--panel-2); color:var(--ink); border:1px solid var(--line);
  border-radius:8px; padding:8px 10px; font:inherit; font-size:12.5px;
}
textarea{resize:vertical; line-height:1.5; min-height:56px}
input[type=text]:focus, textarea:focus{border-color:var(--accent); outline:none}
.row2{display:grid; grid-template-columns:1fr 1fr; gap:10px}
.row3{display:grid; grid-template-columns:1fr 1fr 1fr; gap:8px}

.segs{display:flex; background:var(--panel-2); border:1px solid var(--line); border-radius:9px; padding:3px; gap:3px}
.segs.col{flex-direction:column}
.segs button{flex:1; border:0; background:transparent; color:var(--ink-2); padding:7px 4px; border-radius:6px; font-size:12px; font-weight:500; cursor:pointer}
.segs button:hover{color:var(--ink)}
.segs button[aria-pressed="true"]{background:var(--accent); color:var(--accent-ink); font-weight:700}

.switch{display:flex; align-items:center; justify-content:space-between; gap:10px; padding:8px 10px; border:1px solid var(--line); border-radius:9px; background:var(--panel-2); cursor:pointer; font-size:12.5px; font-weight:500; color:var(--ink)}
.switch .track{width:36px; height:20px; border-radius:999px; background:var(--line); position:relative; flex:none; transition:background .16s ease}
.switch .track::after{content:""; position:absolute; top:2px; left:2px; width:16px; height:16px; border-radius:50%; background:#fff; transition:transform .16s ease; box-shadow:0 1px 2px rgba(0,0,0,.3)}
.switch[aria-pressed="true"] .track{background:var(--accent)}
.switch[aria-pressed="true"] .track::after{transform:translateX(16px)}
.switch[disabled]{opacity:.42; cursor:not-allowed}

.btn{border:1px solid var(--line); background:var(--panel-2); color:var(--ink); border-radius:8px; padding:8px 12px; font-size:12px; font-weight:600; cursor:pointer}
.btn:hover{border-color:var(--ink-3)}
.btn.primary{background:var(--accent); border-color:var(--accent); color:var(--accent-ink)}
.btn.wide{width:100%}
.btn.mini{padding:4px 8px; font-size:11px; border-radius:6px}

.filepick{display:flex; align-items:center; gap:8px; border:1px dashed var(--line); border-radius:9px; padding:8px 10px; background:var(--panel-2)}
.filepick .thumb{width:44px; height:26px; border-radius:4px; flex:none; background:var(--line); background-size:cover; background-position:center}
.filepick .thumb.circle{width:28px; height:28px; border-radius:50%}
.filepick input[type=file]{display:none}
.filepick .pk{font-size:11px; color:var(--ink-2); cursor:pointer; text-decoration:underline; text-underline-offset:2px}
.hint{font-size:11px; color:var(--ink-3); line-height:1.55; margin:0}
.fxbox{display:flex; flex-direction:column; gap:5px; border:1px solid var(--line); border-radius:9px; padding:8px 10px; background:var(--panel-2)}
.fxrow{display:flex; align-items:center; gap:8px; font-size:11px; color:var(--ink-2)}
.fxrow > span{width:28px; flex:none}
.fxrow input[type=range]{flex:1; accent-color:var(--accent); height:16px}
.fxrow b{font-variant-numeric:tabular-nums; width:34px; text-align:right; font-weight:500; color:var(--ink-3)}

/* 색상 팔레트 */
.pal{display:flex; flex-wrap:wrap; gap:4px; align-items:center}
.pal b{width:17px; height:17px; border-radius:50%; cursor:pointer; display:block; border:2px solid transparent}
.pal b[aria-pressed="true"]{border-color:var(--ink); box-shadow:0 0 0 2px var(--panel) inset}
.pal input[type=color]{width:22px; height:22px; padding:0; border:1px solid var(--line); border-radius:5px; background:none; cursor:pointer}

.cnode{border:1px solid var(--line); border-radius:10px; background:var(--panel-2); padding:10px; display:flex; flex-direction:column; gap:8px}
.cnode.lv1{background:transparent}
.cnode-kids{margin-left:12px; padding-left:11px; border-left:2px solid var(--line); display:flex; flex-direction:column; gap:9px; margin-top:2px}
.cnode-head{display:flex; align-items:center; gap:7px}
.depth-tag{font-size:9.5px; font-weight:700; color:var(--accent); background:var(--accent-soft); border-radius:4px; padding:2px 5px; flex:none}
.cnode-head .sp{margin-left:auto; display:flex; gap:4px}
.iconbtn{border:1px solid var(--line); background:var(--panel); color:var(--ink-2); width:24px; height:24px; border-radius:6px; cursor:pointer; font-size:11px; display:grid; place-items:center; padding:0; line-height:1}
.iconbtn:hover{color:var(--ink); border-color:var(--ink-3)}
.iconbtn.del:hover{color:var(--accent); border-color:var(--accent)}
.chips{display:flex; flex-wrap:wrap; gap:5px}
.chip{border:1px solid var(--line); background:var(--panel); color:var(--ink-2); border-radius:999px; padding:4px 9px; font-size:10.5px; font-weight:600; cursor:pointer}
.chip[aria-pressed="true"]{background:var(--accent-soft); border-color:var(--accent); color:var(--accent)}
.listitem{border:1px solid var(--line); border-radius:10px; padding:9px; display:flex; flex-direction:column; gap:7px; background:var(--panel-2)}

@media (max-width:900px){
  .app{grid-template-columns:1fr; grid-template-rows:auto auto; height:auto; min-height:0}
  .rail{order:2; border-right:0; border-top:1px solid var(--line)}
  .rail-body{overflow:visible; padding-bottom:8px}
  .rail-foot{position:sticky; bottom:0; z-index:5}
  .stage{order:1; min-height:0; padding:16px 10px 22px; align-items:flex-start}
  .zoombar{right:12px; bottom:72px; padding:6px 11px; gap:7px}
  .zoombar input[type=range]{width:74px}
}

/* ================================================================
   유튜브 리플리카
   ================================================================ */
.yt{
  --bg:#0f0f0f; --tx:#f1f1f1; --tx2:#aaaaaa; --chip:#272727; --chip2:#3f3f3f;
  --bd:#303030; --input:#121212; --blue:#3ea6ff; --icon:#f1f1f1; --sheet:#212121;
  font-family:"Roboto","Noto Sans KR",Arial,sans-serif; background:var(--bg); color:var(--tx);
}
.yt[data-t="light"]{
  --bg:#ffffff; --tx:#0f0f0f; --tx2:#606060; --chip:#f2f2f2; --chip2:#e5e5e5;
  --bd:#e5e5e5; --input:#ffffff; --blue:#065fd4; --icon:#0f0f0f; --sheet:#ffffff;
}
.scrollpane{overflow-y:auto; overflow-x:hidden; scrollbar-width:none; -ms-overflow-style:none}
.scrollpane::-webkit-scrollbar{display:none}
/* 원본 해상도를 유지하는 이미지 레이어 (max-width 리셋을 반드시 무효화) */
.fximg{position:absolute; display:block; max-width:none !important; max-height:none !important; pointer-events:none}

.pc-screen{background:var(--bg); overflow:hidden; display:flex; flex-direction:column; position:relative}
.macbar{height:28px; flex:none; background:linear-gradient(#f6f6f7,#eeeef0); color:#1c1c1e; display:flex; align-items:center; gap:19px; padding:0 15px; font-size:13px; font-weight:400; letter-spacing:-.1px; white-space:nowrap; overflow:hidden; font-family:-apple-system,BlinkMacSystemFont,"Noto Sans KR",sans-serif; border-bottom:1px solid rgba(0,0,0,.09)}
.macbar.dark{background:linear-gradient(#232326,#1d1d20); color:#f2f2f4; border-bottom-color:rgba(255,255,255,.09)}
.macbar b{font-weight:600}
.macbar .mright{margin-left:auto; display:flex; align-items:center; gap:14px; font-size:13px}
.chrome{background:#dee1e6; padding-top:9px; flex:none}
.chrome.dark{background:#202124}
.chrome-tabs{display:flex; align-items:flex-end; padding:0 9px}
.lights{display:flex; gap:8px; align-items:center; padding:0 12px 8px 4px}
.lights i{width:12px; height:12px; border-radius:50%; display:block}
.tabstrip{display:flex; align-items:flex-end; flex:1; min-width:0; overflow:hidden}
.tab{height:34px; flex:1 1 244px; max-width:244px; min-width:54px; border-radius:9px 9px 0 0; display:flex; align-items:center; gap:7px; padding:0 10px; font-size:12px; color:#3c4043; background:transparent; overflow:hidden; white-space:nowrap}
.chrome.dark .tab{color:#c8ccd0}
.tab.active{background:#fff; color:#202124}
.chrome.dark .tab.active{background:#35363a; color:#e8eaed}
.tab .fav{width:15px; height:15px; border-radius:3px; flex:none; background-size:cover; background-position:center}
.tab .tt{overflow:hidden; text-overflow:ellipsis; flex:1; min-width:0}
.tab .xx{opacity:.55; flex:none; font-size:13px}
.newtab{width:32px; height:32px; display:grid; place-items:center; flex:none; color:#5f6368; font-size:17px; margin-bottom:2px}
.chrome.dark .newtab{color:#9aa0a6}
.bmarks i{background-size:cover; background-position:center}
.chrome-bar{background:#fff; padding:6px 10px; display:flex; align-items:center; gap:8px}
.chrome.dark .chrome-bar{background:#35363a}
.chrome-bar .nav{display:flex; gap:2px; color:#5f6368; align-items:center}
.chrome.dark .chrome-bar .nav{color:#9aa0a6}
.navbtn{width:30px; height:30px; border-radius:50%; display:grid; place-items:center; flex:none}
.navbtn.off{opacity:.38}
.omni{flex:1; height:30px; border-radius:999px; background:#f1f3f4; display:flex; align-items:center; gap:9px; padding:0 13px; font-size:12.5px; color:#202124; overflow:hidden; white-space:nowrap}
.chrome.dark .omni{background:#202124; color:#e8eaed}
.bmarks{background:#fff; display:flex; align-items:center; gap:16px; padding:5px 12px 7px; font-size:11.5px; color:#3c4043; white-space:nowrap; overflow:hidden}
.chrome.dark .bmarks{background:#35363a; color:#c8ccd0}
.bmarks span{display:flex; align-items:center; gap:5px}
.bmarks i{width:14px; height:14px; border-radius:3px; display:block; flex:none}

.yt-page{flex:1; min-height:0; display:flex; flex-direction:column; background:var(--bg)}
.yt-head{height:56px; flex:none; display:flex; align-items:center; gap:16px; padding:0 16px; background:var(--bg)}
.yt-logo{display:flex; align-items:center; gap:5px}
.yt-search{flex:1; display:flex; justify-content:center; align-items:center; max-width:730px; margin:0 auto}
.sbox{flex:1; height:40px; border:1px solid var(--bd); border-radius:999px 0 0 999px; display:flex; align-items:center; padding:0 16px; gap:10px; background:var(--input); font-size:16px; color:var(--tx); max-width:540px}
.sbtn{width:64px; height:40px; border:1px solid var(--bd); border-left:0; background:var(--chip); border-radius:0 999px 999px 0; display:grid; place-items:center; flex:none}
.micbtn{width:40px; height:40px; border-radius:50%; background:var(--chip); display:grid; place-items:center; flex:none; margin-left:8px}
.yt-head-right{display:flex; align-items:center; gap:10px; margin-left:auto}
.create-btn{height:36px; border-radius:999px; background:var(--chip); display:flex; align-items:center; gap:6px; padding:0 15px; font-size:14px; font-weight:500}
.bell{position:relative; width:40px; height:40px; display:grid; place-items:center}
.bell .badge{position:absolute; top:2px; right:2px; background:#e53935; color:#fff; font-size:9px; font-weight:700; border-radius:999px; padding:1px 4px; line-height:1.3}
.avatar{border-radius:50%; background-size:cover; background-position:center; flex:none; display:grid; place-items:center; color:#fff; font-weight:500; overflow:hidden; position:relative}

.yt-body{flex:1; min-height:0; display:flex; gap:24px; padding:24px; align-items:stretch}
.yt-main{flex:1; min-width:0; display:flex; flex-direction:column; min-height:0}
.yt-side{width:402px; flex:none; display:flex; flex-direction:column; gap:8px; min-height:0}
.player{width:100%; height:0; padding-top:56.25%; border-radius:12px; background:#000; background-size:cover; background-position:center; position:relative; overflow:hidden; flex:none}
.player .dur{position:absolute; right:8px; bottom:8px; background:rgba(0,0,0,.8); color:#fff; font-size:12px; font-weight:500; border-radius:4px; padding:2px 4px}

/* 유튜브 플레이어 컨트롤 */
.pl-ui{position:absolute; left:0; right:0; bottom:0; padding:0 12px 4px; color:#fff;
  background:linear-gradient(rgba(0,0,0,0), rgba(0,0,0,.55) 60%, rgba(0,0,0,.72))}
.pl-track{position:relative; height:3px; background:rgba(255,255,255,.28); margin-bottom:5px}
.pl-buffer{position:absolute; left:0; top:0; bottom:0; background:rgba(255,255,255,.45)}
.pl-played{position:absolute; left:0; top:0; bottom:0; background:#ff0000; z-index:2}
.pl-dot{position:absolute; top:50%; width:13px; height:13px; border-radius:50%; background:#ff0000; transform:translate(-50%,-50%); z-index:3}
.pl-row{display:flex; align-items:center; height:42px}
.pl-btn{width:36px; height:36px; display:grid; place-items:center; flex:none}
.pl-time{font-size:13px; margin-left:10px; letter-spacing:.2px; font-variant-numeric:tabular-nums; white-space:nowrap}
.pl-right{margin-left:auto; display:flex; align-items:center}
.pl-hd{position:relative}
.pl-hd i{position:absolute; top:3px; right:2px; background:#ff0000; color:#fff; font-size:7px; font-weight:700; border-radius:2px; padding:0 2px; line-height:1.4; font-style:normal; letter-spacing:.2px}
.pl-m{position:absolute; inset:0; background:rgba(0,0,0,.22)}
.pl-mbtn{position:absolute; left:50%; top:50%; transform:translate(-50%,-50%); width:52px; height:52px; color:#fff; display:grid; place-items:center}
.pl-mtrack{position:absolute; left:12px; right:12px; bottom:11px; height:3px; background:rgba(255,255,255,.3)}
.pl-mplayed{position:absolute; left:0; top:0; bottom:0; background:#ff0000}
.pl-mdot{position:absolute; top:50%; width:12px; height:12px; border-radius:50%; background:#ff0000; transform:translate(-50%,-50%)}
.vtitle{font-size:20px; font-weight:700; line-height:28px; margin:12px 0 0; color:var(--tx)}
.vmeta{display:flex; align-items:center; gap:12px; margin-top:12px; flex-wrap:wrap}
.vchan{display:flex; align-items:center; gap:12px}
.vchan .nm{font-size:16px; font-weight:500; line-height:1.4}
.vchan .subs{font-size:12px; color:var(--tx2)}
.subbtn{height:36px; border-radius:999px; padding:0 16px; display:flex; align-items:center; font-size:14px; font-weight:500; background:var(--tx); color:var(--bg)}
.subbtn.on{background:var(--chip); color:var(--tx)}
.vactions{display:flex; gap:8px; margin-left:auto; flex-wrap:wrap}
.pill{height:36px; border-radius:999px; background:var(--chip); display:flex; align-items:center; gap:7px; padding:0 14px; font-size:14px; font-weight:500}
.pill .sep{width:1px; height:22px; background:var(--chip2)}
.vdesc{margin-top:12px; background:var(--chip); border-radius:12px; padding:12px; font-size:14px; line-height:20px; flex:none}

.cm-head{display:flex; align-items:center; gap:32px; margin:22px 0 20px; flex:none}
.cm-count{font-size:20px; font-weight:700}
.cm-sort{display:flex; align-items:center; gap:8px; font-size:14px; font-weight:500}
.cm-add{display:flex; align-items:center; gap:16px; margin-bottom:26px; flex:none}
.cm-add .ln{flex:1; border-bottom:1px solid var(--bd); padding-bottom:7px; color:var(--tx2); font-size:14px}
.cm-list{display:flex; flex-direction:column; gap:16px; padding-bottom:8px}
.cm{display:flex; gap:16px}
.cm .body{flex:1; min-width:0}
.cm-top{display:flex; align-items:center; gap:4px; flex-wrap:wrap; margin-bottom:2px}
.pinrow{display:flex; align-items:center; gap:6px; font-size:12px; color:var(--tx2); margin-bottom:6px; font-weight:500}
.cm-name{font-size:13px; font-weight:500; line-height:18px}
.cm-name.owner{background:var(--chip); border-radius:999px; padding:2px 7px}
.cm-time{font-size:12px; color:var(--tx2)}
.cm-text{font-size:14px; line-height:20px; white-space:pre-wrap; word-break:break-word}
.cm-more{font-size:14px; color:var(--tx2); margin-top:2px}
.cm-acts{display:flex; align-items:center; gap:8px; margin-top:6px; color:var(--tx2); font-size:12px}
.cm-acts .lk{display:flex; align-items:center; gap:6px}
.cm-acts .reply{font-size:12px; font-weight:500; color:var(--tx); padding:0 8px; height:32px; display:flex; align-items:center; border-radius:999px}
.heart-wrap{position:relative; width:22px; height:22px; margin-left:2px}
.heart-wrap .ha{position:absolute; inset:0; border-radius:50%; overflow:hidden; background-size:cover; background-position:center}
.heart-wrap .hh{position:absolute; right:-4px; bottom:-4px; font-size:11px}
.replies{margin-top:14px; display:flex; flex-direction:column; gap:14px}

function fxHost(key){
  if(!key) return null;
  try{
    if(key==='video.thumb') return [S.video,'thumbFx'];

    if(key.startsWith('rec:')) return [S.recs[Number(key.slice(4))],'thumbFx'];

  }catch(e){}
  return null;
}
function getFx(key){
  const h = fxHost(key);
  if(!h || !h[0]) return {};
  return h[0][h[1]] || (h[0][h[1]] = {x:50,y:50,z:100,ar:1});
}
function fxSize(fx, car){
  const z = (fx && fx.z) || 100;
  const ar = (fx && fx.ar) || car;
  let w, h;
  if(ar > car){ h = 100; w = (ar/car)*100; } else { w = 100; h = (car/ar)*100; }
  return [w*z/100, h*z/100];
}
function fxGeom(fx, car){
  const [w,h] = fxSize(fx, car);
  const x = (fx && fx.x!=null) ? fx.x : 50, y = (fx && fx.y!=null) ? fx.y : 50;
  return { w, h, l:(1-w/100)*x, t:(1-h/100)*y };
}

  const g = fxGeom(fx, car);
  return `<img class="fximg" data-fx="${esc(key||'')}" data-car="${car}" src="${url}" alt=""
    style="left:${g.l.toFixed(3)}%;top:${g.t.toFixed(3)}%;width:${g.w.toFixed(3)}%;height:${g.h.toFixed(3)}%">`;

  const fx = getFx(key);

    el.style.width = g.w.toFixed(3)+'%';

    el.style.left = g.l.toFixed(3)+'%';

/* ---- 재생 시간 ---- */
function toSec(t){
  const p = String(t||'').trim().split(':').map(n=>parseInt(n,10)||0);
  if(p.length>=3) return p[0]*3600 + p[1]*60 + p[2];
  if(p.length===2) return p[0]*60 + p[1];
  return p[0]||0;
}
function fmtSec(s){
  s = Math.max(0, Math.round(s));
  const h = Math.floor(s/3600), m = Math.floor((s%3600)/60), x = s%60;
  const pad = n => String(n).padStart(2,'0');
  return h ? `${h}:${pad(m)}:${pad(x)}` : `${m}:${pad(x)}`;
}
function playPct(){
  const total = toSec(S.video.dur) || 1;
  return Math.max(0, Math.min(100, toSec(S.video.cur)/total*100));
}
function playerOverlay(mobile){
  const v = S.video, mode = v.playerUI || 'thumb';
  if(mode==='thumb') return `<span class="dur">${esc(v.dur)}</span>`;
  if(mode==='clean') return '';
  const pct = playPct();
  if(mobile){
    return `<div class="pl-m"><div class="pl-mbtn">${v.playing?I.plPause:I.plPlay}</div>
      <div class="pl-mtrack"><div class="pl-mplayed" style="width:${pct}%"></div><div class="pl-mdot" style="left:${pct}%"></div></div></div>`;
  }
  return `<div class="pl-ui">
    <div class="pl-track"><div class="pl-buffer" style="width:${Math.min(100,pct+9)}%"></div>
      <div class="pl-played" style="width:${pct}%"></div><div class="pl-dot" style="left:${pct}%"></div></div>
    <div class="pl-row">
      <span class="pl-btn">${v.playing?I.plPause:I.plPlay}</span>
      <span class="pl-btn">${I.plVol}</span>
      <span class="pl-time">${esc(v.cur)} / ${esc(v.dur)}</span>
      <span class="pl-right">
        <span class="pl-btn">${I.plAuto}</span>
        <span class="pl-btn">${I.plCC}</span>
        <span class="pl-btn pl-hd">${I.plGear}<i>HD</i></span>
        <span class="pl-btn">${I.plMini}</span>
        <span class="pl-btn">${I.plFull}</span>
      </span>
    </div></div>`;
}
function patchPlayer(){
  const v = S.video, pct = playPct();
  document.querySelectorAll('#capture .pl-played, #capture .pl-mplayed').forEach(el=>el.style.width = pct+'%');
  document.querySelectorAll('#capture .pl-buffer').forEach(el=>el.style.width = Math.min(100,pct+9)+'%');
  document.querySelectorAll('#capture .pl-dot, #capture .pl-mdot').forEach(el=>el.style.left = pct+'%');
  document.querySelectorAll('#capture .pl-time').forEach(el=>el.textContent = v.cur+' / '+v.dur);
}
function syncPosSlider(){
  const sl = rail.querySelector('[data-poss]');
  if(sl) sl.value = Math.round(playPct()*10);

function commentHTML(c, depth, mobile, path){
  const size = depth===0 ? (mobile?36:40) : 24;
  const kids = (c.replies||[]).length;
  let h = `<div class="cm"><div>${avatarHTML(c.name, c.avatar, size, c.color, 'c:'+path)}</div><div class="body">`;
  if(c.pinned) h += `<div class="pinrow">${I.pin}<span>${esc(c.name)}님이 고정함</span></div>`;
  h += `<div class="cm-top">`;
  h += `<span class="cm-name ${c.owner?'owner':''}">${esc(c.name)}</span><span class="cm-time">${mobile?'· ':''}${esc(c.time)}</span></div>`;
  h += `<div class="cm-text">${esc(c.text)}</div>`;
  if(c.more) h += `<div class="cm-more">자세히 알아보기</div>`;
  h += `<div class="cm-acts"><span class="lk">${I.up}<span>${esc(c.likes||'')}</span></span>
        <span class="lk" style="margin-left:8px">${I.down}</span>`;
  h += mobile ? `<span class="lk" style="margin-left:8px">${I.cmt}</span>` : `<span class="reply">답글</span>`;
  if(c.hearted) h += `<span class="heart-wrap"><span class="ha" style="background-color:${S.video.color||autoColor(S.video.channel)}">${S.video.avatar?imgLayer(S.video.avatar, getFx('video.avatar'), 1, 'video.avatar'):''}</span><span class="hh">❤️</span></span>`;
  h += `</div>`;
  if(kids){
    if(depth===0) h += `<div class="toggle-replies">${I.caret}<span>답글 ${kids}개</span></div>`;
    h += `<div class="replies ${depth>0?'thread':''}">` + c.replies.map((r,j)=>commentHTML(r, depth+1, mobile, path+'.'+j)).join('') + `</div>`;
  }
  return h + `</div></div>`;
}

function renderPC(){
  const dark = S.theme==='dark';
  const [W,H] = RATIOS[S.ratio] || RATIOS['16:9'];
  const narrow = W < 900;
  const wantSide = (S.layout==='recs' || S.sideRecs) && !narrow;
  const descBox = `<div class="vdesc"><b>${esc(S.video.views)} ${esc(S.video.when)} ${esc(S.video.hashtag)}</b>
    <div style="color:var(--blue);margin-top:2px">${esc(S.video.hashtag)}</div></div>`;

  let body = '';
  if(S.layout==='comments'){
    body = `<div class="yt-main"><div class="scrollpane" style="flex:1;min-height:0"><div class="spin">${commentsInner()}</div></div></div>`
         + (wantSide ? recSide() : '');
  } else if(S.layout==='video'){
    body = `<div class="yt-main"><div class="scrollpane" style="flex:1;min-height:0"><div class="spin">${videoBlockPC()}
      ${descBox}${commentsInner()}</div></div></div>`
         + (wantSide ? recSide() : '');
  } else {
    const inlineRecs = narrow ? `<div style="display:flex;flex-direction:column;gap:14px;margin-top:20px">` +
      S.recs.map(r=>`<div class="rec">
        <div class="th" style="width:220px;height:124px;${ph(r.title)}">${r.thumb?imgLayer(r.thumb, r.thumbFx, 220/124, 'rec:'+S.recs.indexOf(r)):''}<span class="d">${esc(r.dur)}</span></div>
        <div class="info"><div class="rt" style="font-size:15px">${esc(r.title)}</div>
          <div class="rc">${esc(r.ch)}</div><div class="rc" style="margin-top:0">▷ ${esc(r.meta)}</div></div></div>`).join('') + `</div>` : '';
    body = `<div class="yt-main"><div class="scrollpane" style="flex:1;min-height:0"><div class="spin">${videoBlockPC()}
      ${descBox}${inlineRecs}</div></div></div>`
         + (wantSide ? recSide() : '');
  }

  let page = `<div class="yt-page">${S.ytHeader?pcHeader():''}<div class="yt-body">${body}</div></div>`;
  let chrome = '';
  if(S.browser){
    const u = S.ui;
    chrome = `<div class="chrome ${dark?'dark':''}">
      <div class="chrome-tabs">
        <div class="lights"><i style="background:#ff5f57"></i><i style="background:#febc2e"></i><i style="background:#28c840"></i></div>
        <div class="tabstrip">
          ${u.tabs.map((t,i)=>`<div class="tab ${i===u.active?'active':''}">
            <span class="fav" style="${t.img?`background-image:url('${t.img}')`:`background:${t.color}`}"></span>
            <span class="tt">${esc(t.title)}</span><span class="xx">✕</span></div>`).join('')}
          <div class="newtab">＋</div>
        </div>
      </div>
      <div class="chrome-bar">
        <span class="nav"><span class="navbtn">${I.navBack}</span><span class="navbtn off">${I.navFwd}</span><span class="navbtn">${I.navReload}</span></span>
        <div class="omni"><span style="opacity:.62;display:flex">${I.navInfo}</span><span>${esc(u.url)}</span>
          <span style="margin-left:auto;opacity:.62;display:flex">${I.navStar}</span></div></div>
      ${S.bookmarks?`<div class="bmarks">${u.bmk.map(b=>`<span><i style="${b.img?`background-image:url('${b.img}')`:`background:${b.c}`}"></i>${esc(b.t)}</span>`).join('')}</div>`:''}
    </div>`;
  }
  const menus = String(S.ui.macMenus||'').split(',').map(x=>x.trim()).filter(Boolean);
  const mac = S.macbar ? `<div class="macbar ${dark?'dark':''}">${I.apple}<b>${esc(S.ui.macApp)}</b>
      ${menus.map(m=>`<span>${esc(m)}</span>`).join('')}
      <span class="mright">${S.ui.macWifi?I.wifi:''}<span>${esc(S.ui.macTime)}</span></span></div>` : '';

  const sizeCSS = `width:${W}px;` + (H ? `height:${H}px;` : '');
  const screen = `<div class="yt pc-screen" data-t="${S.theme}" style="${sizeCSS}">${mac}${chrome}${page}</div>`;
  return wrapMockup(screen, W);
}

function renderMobile(){

function wrapMockup(screen, w){
  if(S.mockup==='macbook')
    return `<div class="mockcol"><div class="lid" style="width:${w+24}px"><div class="notch"></div><div class="inner">${screen}</div></div><div class="lid-base"></div></div>`;
  if(S.mockup==='imac')
    return `<div class="mockcol"><div class="imac-body" style="width:${w+32}px"><div class="inner" style="width:${w}px">${screen}</div>
      <div class="imac-chin"><span style="color:#8a8f96">${I.apple.replace('width="13" height="16"','width="22" height="27"')}</span></div>
    </div><div class="imac-neck"></div><div class="imac-foot"></div></div>`;
  if(S.mockup==='iphone')
    return `<div class="iph-body" style="width:${w+22}px"><div class="iph-island"></div><div class="inner">${screen}</div></div>`;
  return `<div class="plain-shadow">${screen}</div>`;
}

/* ===================== 컨트롤 패널 ===================== */
function seg(label, key, opts, cls){
  return `<div class="field"><span class="flabel">${label}</span><div class="segs ${cls||''}" data-seg="${key}">` +
    opts.map(o=>`<button type="button" data-v="${o[0]}" aria-pressed="${String(S[key])===String(o[0])}">${o[1]}</button>`).join('') + `</div></div>`;
}
function sw(label, key, disabled){
  return `<button type="button" class="switch" data-sw="${key}" aria-pressed="${!!S[key]}" ${disabled?'disabled':''}>
    <span>${label}</span><span class="track"></span></button>`;
}
function txt(label, path, val){
  return `<div class="field"><label>${label}</label><input type="text" data-path="${path}" value="${esc(val)}"></div>`;
}
function vseg(label, key, opts){
  return `<div class="field"><span class="flabel">${label}</span><div class="segs" data-vseg="${key}">` +
    opts.map(o=>`<button type="button" data-v="${o[0]}" aria-pressed="${String(S.video[key])===String(o[0])}">${o[1]}</button>`).join('') + `</div></div>`;
}
function playerCtl(){
  const v = S.video;
  const on = (v.playerUI||'thumb')==='controls';
  return `<div class="fxbox">
    ${vseg('영상 화면','playerUI',[['thumb','썸네일'],['clean','재생 화면'],['controls','컨트롤바']])}
    ${on?vseg('상태','playing',[[true,'재생 중'],[false,'일시정지']]):''}
    ${on?`<label class="fxrow"><span>위치</span><input type="range" data-poss min="0" max="1000" step="1" value="${Math.round(playPct()*10)}"><b>${Math.round(playPct())}%</b></label>`:''}
    <p class="hint">${on
      ? '빨간 진행바는 현재 위치 ÷ 총 길이로 자동 계산돼요.'
      : (v.playerUI==='clean' ? '컨트롤 없이 재생만 하는 화면이에요.' : '오른쪽 아래에 재생시간 배지가 붙어요.')}</p>
  </div>`;
}
function fxCtl(key){
  const fx = getFx(key);
  const x = fx.x!=null?fx.x:50, y = fx.y!=null?fx.y:50, z = fx.z||100;
  return `<div class="fxbox">
    <span class="flabel">이미지 위치 · 확대</span>
    <label class="fxrow"><span>좌우</span><input type="range" data-fxk="${key}" data-fxp="x" min="0" max="100" step="1" value="${x}"><b>${x}</b></label>
    <label class="fxrow"><span>상하</span><input type="range" data-fxk="${key}" data-fxp="y" min="0" max="100" step="1" value="${y}"><b>${y}</b></label>
    <label class="fxrow"><span>확대</span><input type="range" data-fxk="${key}" data-fxp="z" min="100" max="400" step="1" value="${z}"><b>${z}%</b></label>
    <button class="btn mini" data-fxreset="${key}">위치 초기화</button>
  </div>`;
}
function palette(scope, cur){
  return `<div class="field"><span class="flabel">프로필 색</span><div class="pal">` +
    YT_COLORS.map(c=>`<b data-col="${scope}" data-c="${c}" style="background:${c}" aria-pressed="${(cur||'').toUpperCase()===c}" title="${c}"></b>`).join('') +
    `<input type="color" data-colcustom="${scope}" value="${cur||'#FF9800'}" title="직접 지정"></div></div>`;
}

function depthName(d){ return d===0?'댓글':(d===1?'대댓글':'대'.repeat(d)+'댓글'); }
function cnode(c, path){
  const d = path.length-1, p = path.join('.');
  return `<div class="cnode ${d===0?'lv1':''}">
    <div class="cnode-head"><span class="depth-tag">${depthName(d)}</span>
      <span style="font-size:11px;color:var(--ink-3);overflow:hidden;text-overflow:ellipsis;white-space:nowrap">${esc(c.name)}</span>

        <button class="iconbtn" data-mv="${p}" data-dir="1">↓</button>
        <button class="iconbtn del" data-del="${p}">✕</button></span></div>
    <div class="row2">
      <input type="text" data-c="${p}" data-f="name" value="${esc(c.name)}" placeholder="@닉네임">
      <input type="text" data-c="${p}" data-f="time" value="${esc(c.time)}" placeholder="20시간 전"></div>
    <textarea data-c="${p}" data-f="text" rows="3" placeholder="댓글 내용">${esc(c.text)}</textarea>
    <div class="row2">
      <input type="text" data-c="${p}" data-f="likes" value="${esc(c.likes||'')}" placeholder="좋아요 수">
      <div class="filepick" style="padding:5px 8px">
        <span class="thumb circle" style="width:22px;height:22px;${c.avatar?`background-image:url('${c.avatar}')`:`background-color:${c.color||autoColor(c.name)}`}"></span>
        <label class="pk">프로필<input type="file" accept="image/*" data-cimg="${p}"></label>
        ${c.avatar?`<button class="iconbtn" data-cimgclr="${p}" title="사진 빼고 색으로">↺</button>`:''}
      </div></div>
    ${c.avatar?fxCtl('c:'+p):''}
    ${palette('c:'+p, c.color)}
    ${c.avatar?`<p class="hint" style="margin-top:-4px">사진이 들어가 있어요. 색으로 되돌리려면 ↺ 또는 색을 누르세요.</p>`:''}
    <div class="chips">
      <button class="chip" data-flag="${p}" data-k="pinned" aria-pressed="${!!c.pinned}">📌 고정됨</button>
      <button class="chip" data-flag="${p}" data-k="owner" aria-pressed="${!!c.owner}">채널 주인</button>
      <button class="chip" data-flag="${p}" data-k="hearted" aria-pressed="${!!c.hearted}">❤️ 하트</button>
      <button class="chip" data-flag="${p}" data-k="more" aria-pressed="${!!c.more}">자세히</button>
      <button class="chip" data-reply="${p}" style="border-style:dashed">+ 답글</button>
    </div>
    ${(c.replies&&c.replies.length)?`<div class="cnode-kids">${c.replies.map((r,i)=>cnode(r, path.concat(i))).join('')}</div>`:''}
  </div>`;
}
function recNode(r,i){
  return `<div class="listitem">
    <div class="cnode-head"><span class="depth-tag">추천 ${i+1}</span>
      <span class="sp"><button class="iconbtn del" data-delrec="${i}">✕</button></span></div>
    <input type="text" data-r="${i}" data-f="title" value="${esc(r.title)}" placeholder="제목">
    <div class="row2"><input type="text" data-r="${i}" data-f="ch" value="${esc(r.ch)}" placeholder="채널">
      <input type="text" data-r="${i}" data-f="meta" value="${esc(r.meta)}" placeholder="조회수 · 날짜"></div>
    <div class="row2"><input type="text" data-r="${i}" data-f="dur" value="${esc(r.dur)}" placeholder="12:41">
      <div class="filepick" style="padding:5px 8px">
        <span class="thumb" style="width:34px;height:20px;${r.thumb?`background-image:url('${r.thumb}')`:ph(r.title)}"></span>
        <label class="pk">썸네일<input type="file" accept="image/*" data-rimg="${i}"></label>
        ${r.thumb?`<button class="iconbtn" data-rimgclr="${i}" title="이미지 제거">↺</button>`:''}
      </div></div>
    ${r.thumb?fxCtl('rec:'+i):''}</div>`;
}

/* ===================== 트리 조작 ===================== */
function getNode(p){
  const idx = p.split('.').map(Number);
  let arr = S.comments, node = null;
  for(const i of idx){ node = arr[i]; arr = node.replies = node.replies||[]; }
  return node;
}
function getParentArr(p){
  const idx = p.split('.').map(Number);
  let arr = S.comments;
  for(let k=0;k<idx.length-1;k++) arr = arr[idx[k]].replies = arr[idx[k]].replies||[];
  return { arr, i: idx[idx.length-1] };
}
/* 색을 고르면 올려둔 사진은 빠지고 색 동그라미로 돌아감 */
function setColor(scope, col){
  if(scope==='video'){ S.video.color = col; S.video.avatar = ''; }
  else if(scope.startsWith('c:')){ const n = getNode(scope.slice(2)); n.color = col; n.avatar = ''; }
}

/* ===================== 이벤트 ===================== */
const rail = document.getElementById('rail');

rail.addEventListener('click', e => {
  const segBtn = e.target.closest('.segs button');
  if(segBtn && segBtn.parentElement.dataset.vseg){
    let v = segBtn.dataset.v;
    if(v==='true') v = true; else if(v==='false') v = false;
    S.video[segBtn.parentElement.dataset.vseg] = v;
    return full();
  }
  if(segBtn){
    const key = segBtn.parentElement.dataset.seg;
    let v = segBtn.dataset.v;
    if(v==='true') v = true; else if(v==='false') v = false; else if(key==='_scale') v = Number(v);
    S[key] = v;
    if(key==='device') S.mockup = 'none';
    if(key==='layout' && v==='recs') S.sideRecs = true;
    return full(true);
  }
  const swBtn = e.target.closest('.switch');
  if(swBtn && !swBtn.hasAttribute('disabled')){
    const k = swBtn.dataset.sw;
    if(k==='_subscribed') S.video.subscribed = !S.video.subscribed;
    else if(k==='_macWifi') S.ui.macWifi = !S.ui.macWifi;
    else S[k] = !S[k];
    return full();
  }
  const col = e.target.closest('[data-col]');
  if(col){ setColor(col.dataset.col, col.dataset.c); return full(); }
  const flag = e.target.closest('[data-flag]');
  if(flag){ const n = getNode(flag.dataset.flag); n[flag.dataset.k] = !n[flag.dataset.k]; return full(); }
  const rep = e.target.closest('[data-reply]');
  if(rep){ const n = getNode(rep.dataset.reply); (n.replies=n.replies||[]).push({id:uid(),name:'@새사용자',time:'방금 전',likes:'',text:'답글 내용을 입력하세요',replies:[]}); return full(); }
  const del = e.target.closest('[data-del]');
  if(del){ const {arr,i} = getParentArr(del.dataset.del); arr.splice(i,1); return full(); }
  const mv = e.target.closest('[data-mv]');
  if(mv){ const {arr,i} = getParentArr(mv.dataset.mv); const j = i + Number(mv.dataset.dir);
    if(j>=0 && j<arr.length){ const t=arr[i]; arr[i]=arr[j]; arr[j]=t; } return full(); }
  if(e.target.closest('[data-add="root"]')){ S.comments.push({id:uid(),name:'@새사용자',time:'방금 전',likes:'',text:'댓글 내용을 입력하세요',replies:[]}); return full(); }
  if(e.target.closest('[data-addrec]')){ S.recs.push({id:uid(),thumb:'',title:'새 추천 영상 제목',ch:'채널명',meta:'1만  1일 전',dur:'10:00'}); return full(); }
  const dr = e.target.closest('[data-delrec]');
  if(dr){ S.recs.splice(Number(dr.dataset.delrec),1); return full(); }
  if(e.target.closest('[data-addtab]')){ S.ui.tabs.push({id:uid(),title:'새 탭',color:'#9AA0A6'}); return full(); }
  const dt = e.target.closest('[data-deltab]');
  if(dt){ const i=Number(dt.dataset.deltab); if(S.ui.tabs.length>1){ S.ui.tabs.splice(i,1); if(S.ui.active>=S.ui.tabs.length) S.ui.active=S.ui.tabs.length-1; } return full(); }
  const ac = e.target.closest('[data-active]');
  if(ac){ S.ui.active = Number(ac.dataset.active); return full(); }
  if(e.target.closest('[data-addbmk]')){ S.ui.bmk.push({id:uid(),t:'새 즐겨찾기',c:'#4285F4'}); return full(); }
  const db = e.target.closest('[data-delbmk]');
  if(db){ S.ui.bmk.splice(Number(db.dataset.delbmk),1); return full(); }
  const fxr = e.target.closest('[data-fxreset]');
  if(fxr){ const fx = getFx(fxr.dataset.fxreset); fx.x=50; fx.y=50; fx.z=100; return full(); }
  const cic = e.target.closest('[data-cimgclr]');
  if(cic){ getNode(cic.dataset.cimgclr).avatar = ''; return full(); }
  const ric = e.target.closest('[data-rimgclr]');
  if(ric){ S.recs[Number(ric.dataset.rimgclr)].thumb = ''; return full(); }
  const tic = e.target.closest('[data-tabimgclr]');
  if(tic){ S.ui.tabs[Number(tic.dataset.tabimgclr)].img = ''; return full(); }
  const bic = e.target.closest('[data-bmkimgclr]');
  if(bic){ S.ui.bmk[Number(bic.dataset.bmkimgclr)].img = ''; return full(); }
  const cl = e.target.closest('[data-clear]');
  if(cl){ const [a,b] = cl.dataset.clear.split('.'); S[a][b]=''; return full(); }
  if(e.target.id==='btnPng2') savePNG();
});

rail.addEventListener('input', e => {
  const t = e.target;
  if(t.dataset.poss !== undefined){
    const total = toSec(S.video.dur) || 1;
    S.video.cur = fmtSec(total * Number(t.value)/1000);
    const ti = rail.querySelector('[data-path="video.cur"]'); if(ti) ti.value = S.video.cur;
    const lbl = t.nextElementSibling; if(lbl) lbl.textContent = Math.round(Number(t.value)/10)+'%';
    return patchPlayer();
  }
  if(t.dataset.path === 'video.cur' || t.dataset.path === 'video.dur'){
    S.video[t.dataset.path.split('.')[1]] = t.value;
    syncPosSlider(); return patchPlayer();
  }
  if(t.dataset.path){ const [a,b] = t.dataset.path.split('.');
    S[a][b] = (b==='battery') ? (parseInt(t.value,10)||0) : t.value; return renderPreview(); }
  if(t.dataset.c){ getNode(t.dataset.c)[t.dataset.f] = t.value; return renderPreview(); }
  if(t.dataset.r){ S.recs[Number(t.dataset.r)][t.dataset.f] = t.value; return renderPreview(); }
  if(t.dataset.tab !== undefined && t.dataset.tab !== ''){ S.ui.tabs[Number(t.dataset.tab)].title = t.value; return renderPreview(); }
  if(t.dataset.tabcol !== undefined && t.dataset.tabcol !== ''){ S.ui.tabs[Number(t.dataset.tabcol)].color = t.value; return renderPreview(); }
  if(t.dataset.bmk !== undefined && t.dataset.bmk !== ''){ S.ui.bmk[Number(t.dataset.bmk)].t = t.value; return renderPreview(); }
  if(t.dataset.bmkcol !== undefined && t.dataset.bmkcol !== ''){ S.ui.bmk[Number(t.dataset.bmkcol)].c = t.value; return renderPreview(); }
  if(t.dataset.colcustom){ setColor(t.dataset.colcustom, t.value); return renderPreview(); }
  if(t.dataset.fxk){
    const fx = getFx(t.dataset.fxk);
    fx[t.dataset.fxp] = Number(t.value);
    const lbl = t.nextElementSibling;
    if(lbl) lbl.textContent = t.dataset.fxp==='z' ? t.value+'%' : t.value;
    return patchFx(t.dataset.fxk);   /* 미리보기 전체를 다시 그리지 않아서 끊기지 않음 */
  }
});

rail.addEventListener('change', e => {
  const t = e.target;
  if(t.dataset.colcustom){ setColor(t.dataset.colcustom, t.value); return full(); }
  if(t.type!=='file' || !t.files || !t.files[0]) return;
  const fr = new FileReader();
  fr.onload = () => {
    const url = fr.result;
    const apply = ar => {
      let key = '';
      if(t.dataset.img){ const [a,b]=t.dataset.img.split('.'); S[a][b]=url; key = t.dataset.img; }
      else if(t.dataset.cimg){ getNode(t.dataset.cimg).avatar = url; key = 'c:'+t.dataset.cimg; }
      else if(t.dataset.rimg){ S.recs[Number(t.dataset.rimg)].thumb = url; key = 'rec:'+t.dataset.rimg; }
      else if(t.dataset.tabimg){ S.ui.tabs[Number(t.dataset.tabimg)].img = url; }
      else if(t.dataset.bmkimg){ S.ui.bmk[Number(t.dataset.bmkimg)].img = url; }
      if(key){ const h = fxHost(key); if(h && h[0]) h[0][h[1]] = {x:50, y:50, z:100, ar:ar||1}; }
      full();
    };
    const im = new Image();
    im.onload = () => apply(im.naturalWidth / im.naturalHeight);
    im.onerror = () => apply(1);
    im.src = url;
  };
  fr.readAsDataURL(t.files[0]);
});

function full(refit){
  const open = [...document.querySelectorAll('details.sec')].map(d=>d.open);
  const sc = rail.scrollTop;
  renderRail(); renderPreview();
  document.querySelectorAll('details.sec').forEach((d,i)=>{ if(open[i]!==undefined) d.open = open[i]; });
  rail.scrollTop = sc;
  if(refit) setTimeout(fit, 20);
}

/* 확대 */
const stageInner = document.getElementById('stageInner');
const stageBox = document.getElementById('stageBox');
const zoom = document.getElementById('zoom'), zoomVal = document.getElementById('zoomVal');
let curScale = 1, natW = 0, natH = 0;

function measureStage(){
  const el = document.getElementById('capture').firstElementChild;
  if(!el){ natW = natH = 0; return; }
  const prev = stageInner.style.transform;
  stageInner.style.transform = 'none';
  const r = el.getBoundingClientRect();
  natW = r.width; natH = r.height;
  stageInner.style.transform = prev;
  sizeBox();
}
function sizeBox(){
  stageBox.style.width  = Math.max(1, Math.round(natW*curScale))+'px';
  stageBox.style.height = Math.max(1, Math.round(natH*curScale))+'px';
}
function applyZoom(v){
  curScale = Number(v)/100;
  stageInner.style.transform = `scale(${curScale})`;
  zoomVal.textContent = Math.round(Number(v))+'%';
  sizeBox();
}
zoom.addEventListener('input', ()=>applyZoom(zoom.value));
document.getElementById('btnFit').addEventListener('click', fit);
function fit(){
  const stage = document.getElementById('stage');
  measureStage();
  if(!natW) return;
  const narrow = window.innerWidth <= 900;
  const byW = ((stage.clientWidth - (narrow ? 22 : 70))/natW)*100;
  const byH = ((window.innerHeight - 150)/natH)*100;
  const target = Math.max(10, Math.min(130, Math.floor(narrow ? byW : Math.min(byW, byH))));
  zoom.value = target; applyZoom(target);
}
let fitTimer = null;
window.addEventListener('resize', ()=>{ clearTimeout(fitTimer); fitTimer = setTimeout(fit, 160); });

/* PNG 저장 */
let dlNs = null;
if(window.claude && typeof claude.use === 'function') claude.use('downloads').then(ns=>{dlNs=ns}).catch(()=>{});
function freezeScroll(on){
  document.querySelectorAll('#capture .scrollpane').forEach(el=>{
    const kid = el.firstElementChild; if(!kid) return;
    if(on){ el.dataset.st = el.scrollTop; kid.style.marginTop = (-el.scrollTop)+'px'; el.scrollTop = 0; }
    else { kid.style.marginTop = ''; el.scrollTop = Number(el.dataset.st||0); }
  });
}
function fallbackSave(cv, name){
  cv.toBlob(blob => {
    const url = URL.createObjectURL(blob);
    const a = document.createElement('a'); a.download = name; a.href = url; a.click();
    setTimeout(()=>URL.revokeObjectURL(url), 4000);
  }, 'image/png');
}
function savePNG(){
  const node = document.getElementById('capture');
  const prev = stageInner.style.transform;
  const name = `youtube-comment-${S.device}-${S.theme}.png`;
  stageInner.style.transform = 'scale(1)';
  freezeScroll(true);
  html2canvas(node, {backgroundColor:null, scale:S._scale||3, useCORS:true, allowTaint:true, imageTimeout:0, logging:false}).then(cv=>{
    freezeScroll(false); stageInner.style.transform = prev; sizeBox();
    if(dlNs) cv.toBlob(blob => { dlNs.save({filename:name, data:blob}).catch(err=>{ if(!err||err.code!=='declined') fallbackSave(cv,name); }); }, 'image/png');
    else fallbackSave(cv, name);
  }).catch(()=>{ freezeScroll(false); stageInner.style.transform = prev; sizeBox(); });
}
document.getElementById('btnPng').addEventListener('click', savePNG);
document.getElementById('btnReset').addEventListener('click', ()=>{ const sc=S._scale; S = defaultState(); S._scale=sc; full(true); });

renderRail(); renderPreview(); setTimeout(fit, 60);
</script>
